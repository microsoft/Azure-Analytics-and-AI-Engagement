apiVersion: apps/v1
kind: Deployment
metadata:
  name: hcp-portal-web
  namespace: hcp-portal
  labels:
    app: hcp-portal-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hcp-portal-web
  template:
    metadata:
      labels:
        app: hcp-portal-web
    spec:
      containers:
        - name: hcp-portal-web
          image: FRONTEND_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: "http://hcp-portal-api/api"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
