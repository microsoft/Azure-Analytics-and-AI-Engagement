apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hcp-portal-api
  namespace: hcp-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hcp-portal-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
