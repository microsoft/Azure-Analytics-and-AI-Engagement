apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hcp-portal-api
  namespace: hcp-portal
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - host: API_HOST_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hcp-portal-api
                port:
                  number: 80
