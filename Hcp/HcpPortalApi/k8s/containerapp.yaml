apiVersion: containerapps.io/v1
kind: ContainerApp
metadata:
  name: hcp-enrollment-worker
  namespace: hcp-portal
spec:
  environmentId: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.App/managedEnvironments/hcp-env
  identity:
    type: SystemAssigned
  configuration:
    ingress:
      external: false
    registries:
    - server: {acrRegistry}
      username: {acrUsername}
      passwordSecretRef: acr-password
    secrets:
    - name: acr-password
      value: {acrPassword}
  template:
    containers:
    - name: hcp-enrollment-worker
      image: {acrRegistry}/hcp-enrollment-worker:latest
      env:
      - name: ServiceBus__FullyQualifiedNamespace
        value: {serviceBusNamespace}.servicebus.windows.net
      - name: ServiceBus__QueueName
        value: enrollment-events
      - name: DOTNET_ENVIRONMENT
        value: Production
      resources:
        cpu: 0.5
        memory: 1Gi
    scale:
      minReplicas: 0
      maxReplicas: 10
      rules:
      - name: queue-depth
        custom:
          type: azure-servicebus
          metadata:
            queueName: enrollment-events
            namespace: {serviceBusNamespace}
            messageCount: "30"
          identity: system
