apiVersion: v1
kind: ServiceAccount
metadata:
  name: hcp-enrollment-worker
  namespace: hcp-portal-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hcp-enrollment-worker
  namespace: hcp-portal-worker
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hcp-enrollment-worker
  namespace: hcp-portal-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hcp-enrollment-worker
subjects:
- kind: ServiceAccount
  name: hcp-enrollment-worker
  namespace: hcp-portal-worker
