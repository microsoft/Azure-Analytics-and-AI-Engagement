apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharma-backend
  namespace: pharma
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pharma-backend
  template:
    metadata:
      labels:
        app: pharma-backend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: pharma-backend
      containers:
        - name: pharma-backend
          image: __ACR_LOGIN_SERVER__/pharma-backend:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AZURE_KEYVAULT_URI
              value: __KEYVAULT_URI__
            - name: AZURE_APPCONFIG_ENDPOINT
              value: __APPCONFIG_ENDPOINT__
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
